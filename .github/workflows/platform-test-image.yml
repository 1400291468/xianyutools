name: 构建文生界测试镜像

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.platform-test'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - '.github/workflows/platform-test-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-test-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.platform-test
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/1400291468/xianyutools:platform-test
            ghcr.io/1400291468/xianyutools:platform-test-${{ github.sha }}
          build-args: |
            APP_VERSION=platform-test-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=platform-test-amd64
          cache-to: type=gha,mode=max,scope=platform-test-amd64